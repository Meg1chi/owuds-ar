<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teddy AR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
body { margin:0; overflow:hidden; }
</style>

<script>
AFRAME.registerComponent('gesture-handler', {
  init: function () {
    this.scale = 1;
    this.position = { x: 0, y: 0, z: -2 };
    this.startTouch = null;

    this.el.sceneEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        this.startTouch = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      }
    });

    this.el.sceneEl.addEventListener('touchmove', (e) => {

      // 1本指ドラッグ
      if (e.touches.length === 1 && this.startTouch) {
        let dx = e.touches[0].clientX - this.startTouch.x;
        let dy = e.touches[0].clientY - this.startTouch.y;

        // 動きをゆっくりに（0.002で減速）
        this.position.x += dx * 0.002;
        this.position.y -= dy * 0.002;

        this.el.setAttribute('position', this.position);

        this.startTouch = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      }

      // 2本指ピンチ
      if (e.touches.length === 2) {
        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (!this.startDistance) {
          this.startDistance = distance;
        } else {
          let scaleFactor = distance / this.startDistance;
          this.scale *= scaleFactor;
          this.scale = Math.min(Math.max(this.scale, 0.3), 3);

          this.el.setAttribute('scale', {
            x: this.scale,
            y: this.scale,
            z: this.scale
          });

          this.startDistance = distance;
        }
      }

    });

    this.el.sceneEl.addEventListener('touchend', () => {
      this.startDistance = null;
      this.startTouch = null;
    });
  }
});
</script>

</head>

<body>

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  renderer="logarithmicDepthBuffer: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>

  <!-- 画像を事前読み込み -->
  <a-assets>
    <img id="teddy" src="teddy.png">
    <img id="squirrel" src="squirrel.png">
    <img id="owl" src="owl.png">
    <img id="rabbit" src="rabbit.png">
    <img id="raccoon" src="raccoon.png">
    <img id="bg" src="background.png">
  </a-assets>

  <a-entity position="0 0 -2" gesture-handler>

    <!-- 背景 -->
<a-plane
  src="#bg"
  position="0 0 -0.3"
  width="1.2"
  height="0.8"
  material="transparent: true; alphaTest: 0"
></a-plane>

<a-image
  id="randomBear"
  src="#teddy"
  position="0 -0.3 0"
  width="0.7"
  height="0.95"
  material="transparent: true; alphaTest: 0"
></a-image>

  </a-entity>

  <a-camera></a-camera>

</a-scene>
<script>

const bearImages = [
  "#teddy",
  "#squirrel",
  "#owl",
  "#rabbit",
  "#raccoon"
];

const randomImage =
  bearImages[Math.floor(Math.random() * bearImages.length)];

document
  .querySelector("#randomBear")
  .setAttribute("src", randomImage);

</script>

</body>
</html>
